[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsbseg"
version = "1.0.0"
description = "TSB-SEG: experiment pipelines and analysis of the time-series segmentation benchmark"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Félix Chavelli" }]
dependencies = [
    "tsseg==0.3.0",
    "hydra-core>=1.3.2,<1.4",
    "hydra-submitit-launcher>=1.2,<2",
    "omegaconf>=2.3",
    "mlflow>=3.8,<4",
    "aeon>=1.2,<2",
    "numpy",
    "pandas>=2.1",
    "scipy",
    "pyarrow",
    "pyyaml",
    "matplotlib>=3.9",
    "tqdm",
]

[project.optional-dependencies]
# Every method of the benchmark (neural networks, Prophet, TS-CP2, FLUSS).
methods = [
    "tsseg[torch,prophet,accelerators,aeon,tglad,tscp2]==0.3.0",
    "stumpy",
]
dev = ["pytest>=8.0", "ruff==0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# Logging switches set before the imports that read them.
"src/tsbseg/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["tsbseg", "analysis"]
