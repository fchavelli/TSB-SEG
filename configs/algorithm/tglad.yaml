name: tglad
task: change_point

instance:
  _target_: tsseg.algorithms.tglad.detector.TGLADDetector

  window_size: 32
  stride: 16
  batch_size: 8
  threshold: 0.5
  min_spacing: null
  epochs: 100
  learning_rate: 0.001
  glad_iterations: 5
  eval_offset: 0.1

tunable_parameters:
  - window_size: [32, 64, 128]
  - threshold: [0.1, 0.3, 0.5]
  - epochs: [100, 500]